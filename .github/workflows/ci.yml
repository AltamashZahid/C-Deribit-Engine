name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-release
            cxx: g++
            flags: ""
          - name: clang-asan-ubsan
            cxx: clang++
            flags: "-DDE_ENABLE_ASAN=ON -DCMAKE_BUILD_TYPE=Debug"
          - name: clang-tsan
            cxx: clang++
            flags: "-DDE_ENABLE_TSAN=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo"
    name: linux-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libboost-all-dev libssl-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} ${{ matrix.flags }}
      - name: Build
        run: cmake --build build -j 2
      - name: Test
        run: ./build/unit_tests
      - name: Benchmark (smoke)
        if: matrix.name == 'gcc-release'
        run: ./build/engine_bench 20000

  windows-msys2:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-openssl
      - name: Configure
        run: cmake -S . -B build -G Ninja
      - name: Build
        run: cmake --build build -j 2
      - name: Test
        run: ./build/unit_tests.exe
